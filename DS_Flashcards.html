<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DS Flashcards — answer hidden until you flip</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --ink: #e8eef7;
    --muted: #8b9bb4;
    --accent: #7eb8ff;
    --good: #3dcf8e;
    --again: #ff6b7a;
    --hard: #ffb020;
    --card: #243044;
    --line: #2e3d55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 16px 20px 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.primary { background: #2a4a78; border-color: #3d6aa8; }
  button:hover { filter: brightness(1.08); }
  .stats { color: var(--muted); font-size: 0.85rem; margin-left: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 20px 40px; }
  .stage { perspective: 1200px; min-height: 280px; }
  .card {
    position: relative;
    min-height: 280px;
    transform-style: preserve-3d;
    transition: transform 0.45s ease;
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .back { transform: rotateY(180deg); background: #1e334d; }
  .label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .text { font-size: 1.25rem; line-height: 1.45; }
  .tag {
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 12px 0 16px; }
  .grades { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .grades button { min-width: 88px; font-weight: 600; }
  .again { background: #4a2230; border-color: #7a3344; color: #ffb3bc; }
  .hard { background: #4a3a18; border-color: #7a5e22; color: #ffd27a; }
  .good { background: #173a2c; border-color: #2a6a4e; color: #9be7c4; }
  .easy { background: #1a3348; border-color: #3d6aa8; color: #b7d6ff; }
  .done {
    background: var(--panel);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
<header>
  <h1>DS flashcards</h1>
  <p class="sub">Question first. Answer stays hidden until you flip the card.</p>
  <div class="row">
    <select id="filter"></select>
    <button id="shuffle">Shuffle</button>
    <button id="restart">Restart deck</button>
    <span class="stats" id="stats"></span>
  </div>
</header>
<main>
  <div id="quiz">
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="label">Question — tap or press Space to flip</div>
          <div class="text" id="front"></div>
          <div class="tag" id="tag"></div>
        </div>
        <div class="face back">
          <div class="label">Answer</div>
          <div class="text" id="back"></div>
        </div>
      </div>
    </div>
    <p class="hint">Space / click = flip &nbsp;·&nbsp; 1 Again &nbsp;2 Hard &nbsp;3 Good &nbsp;4 Easy</p>
    <div class="grades">
      <button class="again" data-grade="again">Again</button>
      <button class="hard" data-grade="hard">Hard</button>
      <button class="good" data-grade="good">Good</button>
      <button class="easy" data-grade="easy">Easy</button>
    </div>
  </div>
  <div class="done" id="done">
    <h2>Deck complete</h2>
    <p id="summary"></p>
    <button class="primary" id="againDeck">Study again</button>
  </div>
</main>
<script>
const CARDS = [{"front": "What is the one-sentence job of a data science model?", "back": "Turn messy inputs into a decision or an estimate you can defend \u2014 with error you can measure.", "tag": "ds::mindset"}, {"front": "Why does \"error you can measure\" matter more than a fancy algorithm?", "back": "If you cannot say how wrong you are, and on whom, you cannot choose a model or ship it. Metrics beat vibes.", "tag": "ds::mindset"}, {"front": "Name the pipeline in order, from question to number someone can use.", "back": "Question \u2192 data \u2192 clean \u2192 explore \u2192 model or test \u2192 interpret \u2192 limitation / next action. Skip a step and the later math lies.", "tag": "ds::mindset"}, {"front": "What does a derivative tell you about a function f(w)?", "back": "The instantaneous slope: how much f changes if w nudges a tiny bit. Units: output-per-input.", "tag": "ds::calc"}, {"front": "If loss L is a function of weight w, which way should you move w to make L smaller?", "back": "Opposite the derivative: if dL/dw is positive, decrease w; if negative, increase w.", "tag": "ds::calc"}, {"front": "Write the first-order (linear) approximation of f near w.", "back": "f(w + \u0394w) \u2248 f(w) + f'(w) \u00b7 \u0394w. Gradient descent is this idea used as a step rule.", "tag": "ds::calc"}, {"front": "What is a gradient, in plain language?", "back": "The vector of all partial derivatives. It points to the steepest uphill direction in parameter space.", "tag": "ds::calc"}, {"front": "Write the gradient-descent update for a parameter vector w.", "back": "w \u2190 w \u2212 \u03b1 \u2207L(w). Minus = downhill. \u03b1 = step size (learning rate).", "tag": "ds::gd"}, {"front": "What does a too-large learning rate look like on a loss-vs-step plot?", "back": "Loss jumps, oscillates, or blows up instead of settling downward.", "tag": "ds::gd"}, {"front": "What does a too-small learning rate look like?", "back": "Loss crawls. A short run looks \"stuck\" even if it would get there eventually.", "tag": "ds::gd"}, {"front": "For simple linear regression, write \u0177 in terms of w and b.", "back": "\u0177 = w \u00b7 x + b  (one feature: \u0177 = wx + b). w stretches, b shifts.", "tag": "ds::gd"}, {"front": "For n points, write mean squared error as a loss.", "back": "L = (1/n) \u03a3 (\u0177\u1d62 \u2212 y\u1d62)\u00b2. Squares punish big misses and make the calculus smooth.", "tag": "ds::gd"}, {"front": "Why square the residuals instead of using raw (\u0177 \u2212 y)?", "back": "Raw errors cancel (over + under). Squares are always positive, emphasize large misses, and have a clean derivative.", "tag": "ds::gd"}, {"front": "After one GD step, what must you recompute before the next step?", "back": "Predictions and the new gradient at the new weights. The slope is local; last step's slope is stale.", "tag": "ds::gd"}, {"front": "Explain GD as walking a foggy hill with only a slope meter.", "back": "You cannot see the valley. Meter says \"uphill is that way.\" Step the other way, remeasure, repeat. \u03b1 is how far you dare move before checking.", "tag": "ds::gd"}, {"front": "What does a vector mean in a data table?", "back": "One row can be a point in feature space. One column can be a direction. Dot products and distances live in that geometry.", "tag": "ds::linalg"}, {"front": "What does the dot product a \u00b7 b compute, two ways?", "back": "\u03a3 a\u1d62b\u1d62, which also equals ||a|| ||b|| cos\u03b8. Big when vectors point the same way.", "tag": "ds::linalg"}, {"front": "When is a \u00b7 b = 0?", "back": "The vectors are orthogonal (right angle). In data: those two directions carry no linear overlap.", "tag": "ds::linalg"}, {"front": "Why does \"project onto a direction\" show up in DS?", "back": "Regression, PCA, and many scores are \"how much of this point lies along that axis?\" That is a projection / weighted sum.", "tag": "ds::linalg"}, {"front": "What is a matrix\u2013vector product Xw doing to a dataset?", "back": "Each row of X is dotted with w. You get one number per row: a linear score or prediction.", "tag": "ds::linalg"}, {"front": "What is a probability, operationally?", "back": "A long-run fraction: if this process ran forever, about what share of times would the event happen? Between 0 and 1.", "tag": "ds::stats"}, {"front": "Mean vs median \u2014 when is the median the better \"typical\" value?", "back": "When the distribution is skewed or has wild outliers. Median ignores how far the tail goes.", "tag": "ds::stats"}, {"front": "What does a standard deviation measure?", "back": "Typical distance of a point from the mean, in the original units. Not the same thing as \"range.\"", "tag": "ds::stats"}, {"front": "What is a z-score for a value x?", "back": "z = (x \u2212 \u03bc) / \u03c3. \"How many standard deviations from the mean?\" Sign says above or below.", "tag": "ds::stats"}, {"front": "What does the 68\u201395\u201399.7 rule say for a normal (bell) curve?", "back": "About 68% within 1 SD of the mean, 95% within 2, 99.7% within 3. Only for roughly bell-shaped data.", "tag": "ds::stats"}, {"front": "Sampling distribution of the mean \u2014 what happens as n grows?", "back": "The mean's spread shrinks like \u03c3/\u221an. Bigger samples, tighter estimate of the mean.", "tag": "ds::stats"}, {"front": "Write a t-interval for a mean when \u03c3 is unknown.", "back": "x\u0304 \u00b1 t* \u00b7 (s / \u221an). t* depends on confidence level and df = n \u2212 1.", "tag": "ds::stats"}, {"front": "When do you use t instead of z for a mean?", "back": "\u03c3 unknown and you are using the sample s. t is a bit fatter-tailed than z to pay for that extra uncertainty.", "tag": "ds::stats"}, {"front": "Null hypothesis in one sentence.", "back": "The boring default you will only abandon if the data are too weird under it. Often \"no difference\" or \"no effect.\"", "tag": "ds::stats"}, {"front": "p-value in one careful sentence.", "back": "If the null were true, how often would you see a result this extreme or more? Small p = data are awkward for the null.", "tag": "ds::stats"}, {"front": "What a p-value is NOT.", "back": "Not \"probability the null is true.\" Not \"probability you are wrong.\" Not effect size.", "tag": "ds::stats"}, {"front": "Two-sample t-test is asking what?", "back": "Is the difference in group means bigger than you'd expect from chance variation, given the spreads and sample sizes?", "tag": "ds::stats"}, {"front": "Chi-squared test of independence is asking what?", "back": "Are these two categorical variables associated, or do the cell counts look like independence (row% \u00d7 column%)?", "tag": "ds::stats"}, {"front": "Confidence interval vs p-value \u2014 which should you quote to a stakeholder first?", "back": "The interval (estimate + uncertainty in real units). p only says \"compatible with zero or not.\"", "tag": "ds::stats"}, {"front": "What does a Boolean mask on a DataFrame do?", "back": "A True/False series aligned to rows. df[mask] keeps rows where the value is True.", "tag": "ds::pandas"}, {"front": "Why prefer df.loc[mask, \"col\"] = value over df[mask][\"col\"] = value?", "back": "Chained [][] can hit a copy and silently not write. .loc is one indexer: rows and column together.", "tag": "ds::pandas"}, {"front": "What does df.loc[df[\"x\"] > 0, [\"a\",\"b\"]] return?", "back": "Rows where x > 0, and only columns a and b.", "tag": "ds::pandas"}, {"front": "How do you combine two conditions in a mask?", "back": "Use & (and), | (or), ~ (not). Wrap each comparison in parentheses: (df.a > 0) & (df.b == \"VA\").", "tag": "ds::pandas"}, {"front": ".iloc vs .loc \u2014 what's the difference?", "back": ".iloc is position (0, 1, 2\u2026). .loc is labels / Boolean conditions. Mixing them is a common bug.", "tag": "ds::pandas"}, {"front": "What is a groupby in one sentence?", "back": "Split rows into groups, apply a summary to each group, glue the summaries back. Split-apply-combine.", "tag": "ds::pandas"}, {"front": "SELECT does what, vs FROM, vs WHERE?", "back": "SELECT picks columns. FROM picks the table. WHERE filters rows before grouping.", "tag": "ds::sql"}, {"front": "WHERE vs HAVING.", "back": "WHERE filters raw rows. HAVING filters after GROUP BY (so you can keep groups whose SUM/AVG/COUNT meet a rule).", "tag": "ds::sql"}, {"front": "Inner join vs left join, in one picture each.", "back": "Inner: only keys in both tables. Left: every row from the left table, blanks where the right table has no match.", "tag": "ds::sql"}, {"front": "Why can a join quietly multiply your row count?", "back": "Duplicate keys on one side fan out. Always check counts before vs after a join.", "tag": "ds::sql"}, {"front": "GROUP BY rule of thumb.", "back": "Every selected column is either in the GROUP BY or inside an aggregate (COUNT, SUM, AVG, MIN, MAX).", "tag": "ds::sql"}, {"front": "Train/test split \u2014 why?", "back": "Test data is a rehearsal for \"data you have not tuned on.\" Peeking at test while you tweak is cheating the rehearsal.", "tag": "ds::model"}, {"front": "Overfitting in one sentence.", "back": "The model memorized this sample's noise and will look worse on new rows.", "tag": "ds::model"}, {"front": "Underfitting in one sentence.", "back": "The model is too stiff or too simple to catch a real pattern that is there.", "tag": "ds::model"}, {"front": "What should a metrics table always include besides the headline score?", "back": "The split it was measured on, the sample size, and a comparison (baseline / naive guess). A lonely 0.91 is not a result.", "tag": "ds::model"}, {"front": "Name a sane baseline before you celebrate a model.", "back": "Predict the mean (regression) or the majority class (classification). If you cannot beat that, you do not have a model yet.", "tag": "ds::model"}, {"front": "Leakage \u2014 give the pattern.", "back": "Information from the future, or from the target itself, snuck into the features. Accuracy looks magical and dies in production.", "tag": "ds::model"}, {"front": "Correlation is not causation \u2014 say it operationally.", "back": "Two columns moving together does not tell you what to change to get an effect. You need a design or a story about confounders.", "tag": "ds::pitfall"}, {"front": "Missing data: name two different reasons rows are blank.", "back": "Random holes vs a systematic skip (people who owe money don't answer \"income\"). The second one biases you.", "tag": "ds::pitfall"}, {"front": "What is the first plot you should make of a new numeric column?", "back": "A histogram or box plot. Mean and SD without shape will lie to you.", "tag": "ds::pitfall"}, {"front": "If a result is surprising, what do you check before you believe it?", "back": "Joins and row counts, filters, units, missingness, and whether you used the test set to tune. Surprise is usually a bug.", "tag": "ds::pitfall"}];

let deck = [];
let i = 0;
let flipped = false;
let marks = {again:0, hard:0, good:0, easy:0};

const filter = document.getElementById("filter");
const tags = ["all", ...new Set(CARDS.map(c => c.tag))];
tags.forEach(t => {
  const o = document.createElement("option");
  o.value = t;
  o.textContent = t === "all" ? "All topics (55)" : t.replace("ds::","");
  filter.appendChild(o);
});

function build() {
  const t = filter.value;
  deck = CARDS.filter(c => t === "all" || c.tag === t).map(c => ({...c}));
  i = 0; flipped = false;
  marks = {again:0, hard:0, good:0, easy:0};
  document.getElementById("quiz").style.display = "block";
  document.getElementById("done").style.display = "none";
  render();
}
function render() {
  if (i >= deck.length) {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("done").style.display = "block";
    document.getElementById("summary").textContent =
      `Again ${marks.again} · Hard ${marks.hard} · Good ${marks.good} · Easy ${marks.easy}`;
    return;
  }
  const c = deck[i];
  document.getElementById("front").textContent = c.front;
  document.getElementById("back").textContent = c.back;
  document.getElementById("tag").textContent = c.tag.replace("ds::","") + "  ·  " + (i+1) + " / " + deck.length;
  document.getElementById("card").classList.remove("flipped");
  flipped = false;
  document.getElementById("stats").textContent = (i+1) + " of " + deck.length;
}
function flip() {
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
}
function grade(g) {
  if (!flipped) { flip(); return; }
  marks[g]++;
  i++;
  render();
}

document.getElementById("card").onclick = flip;
document.getElementById("shuffle").onclick = () => {
  for (let k = deck.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k+1));
    [deck[k], deck[j]] = [deck[j], deck[k]];
  }
  i = 0; render();
};
document.getElementById("restart").onclick = build;
document.getElementById("againDeck").onclick = build;
filter.onchange = build;
document.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => grade(b.dataset.grade));
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); flip(); }
  if (e.key === "1") grade("again");
  if (e.key === "2") grade("hard");
  if (e.key === "3") grade("good");
  if (e.key === "4") grade("easy");
});
build();
</script>
</body>
</html>
